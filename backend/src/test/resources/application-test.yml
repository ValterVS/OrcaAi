# The datasource and Flyway users come from TestcontainersConfiguration.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/testmigration
  mail:
    # Replaced by RecordingMailSender; nothing connects to it.
    host: localhost

orcaai:
  account:
    public-url: http://localhost:3000
    mail-from: nao-responda@orcaai.test
  team:
    invitations-per-user-per-hour: 1000
    invitations-per-organization-per-hour: 1000
  security:
    rate-limit:
      login:
        max-attempts-per-address: 1000
        max-failures-per-address-and-account: 1000
        window: 1m
      signup:
        max-attempts-per-address: 1000
        window: 1m
      email-requests:
        max-attempts-per-address: 1000
        window: 1m
      token-submissions:
        max-attempts-per-address: 1000
        window: 1m
