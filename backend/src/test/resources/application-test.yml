# The datasource and Flyway users come from TestcontainersConfiguration.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/testmigration

orcaai:
  security:
    rate-limit:
      login:
        max-attempts-per-address: 1000
        max-failures-per-address-and-account: 1000
        window: 1m
      signup:
        max-attempts-per-address: 1000
        window: 1m
