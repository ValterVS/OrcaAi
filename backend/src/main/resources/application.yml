# Defaults are production-safe. Local overrides live in application-dev.yml.
spring:
  application:
    name: orcaai
  datasource:
    # Runtime user: DML only, no ownership of tables (see docs/security.md).
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      # Rejects unexpected fields (organizationId, role, ...) instead of silently ignoring them.
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
  mail:
    # Any SMTP provider; credentials only from the environment.
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
      # Used for the Message-ID; without it JavaMail resolves the local host name on every send.
      mail.from: ${MAIL_FROM}

server:
  # Forwarded headers are ignored unless a trusted proxy is configured explicitly
  # (SERVER_FORWARD_HEADERS_STRATEGY=native plus SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES).
  forward-headers-strategy: none
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # Email delivery problems must not take the application out of the load balancer.
    mail:
      enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

orcaai:
  account:
    # Base of the links sent by email; never derived from the request Host header.
    public-url: ${APP_PUBLIC_URL}
    mail-from: ${MAIL_FROM}
    email-verification-ttl: 24h
    password-reset-ttl: 30m
    # Minimum interval between emails of the same kind to one account.
    email-cooldown: 2m
  security:
    rate-limit:
      login:
        max-attempts-per-address: 30
        max-failures-per-address-and-account: 5
        window: 15m
      signup:
        max-attempts-per-address: 5
        window: 1h
      email-requests:
        max-attempts-per-address: 10
        window: 1h
      token-submissions:
        max-attempts-per-address: 20
        window: 15m
