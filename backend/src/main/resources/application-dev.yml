spring:
  config:
    # The shared .env at the repository root (also used by docker compose). Real environment variables win.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
  flyway:
    # Migrations run as the schema owner; the application connects with the restricted user.
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  mail:
    # Mailpit (docker compose): catches every email locally, nothing is delivered.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:${MAILPIT_SMTP_PORT:1025}}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.starttls.required: false
      mail.from: ${MAIL_FROM:nao-responda@orcaai.local}

server:
  servlet:
    session:
      cookie:
        # Local development runs over plain HTTP.
        secure: false

orcaai:
  account:
    public-url: ${APP_PUBLIC_URL:http://localhost:3000}
    mail-from: ${MAIL_FROM:nao-responda@orcaai.local}
  dev:
    bootstrap:
      email: ${DEV_BOOTSTRAP_EMAIL:}
      password: ${DEV_BOOTSTRAP_PASSWORD:}

logging:
  level:
    com.orcaai: debug
    # Spring transaction internals; too noisy at debug.
    com.orcaai.shared.tenancy.TenantTransactionManager: info
